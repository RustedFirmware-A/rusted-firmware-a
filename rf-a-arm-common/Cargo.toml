[package]
name = "rf-a-arm-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "BSD-3-Clause"
description = "Common components specific to Arm platforms."

[dependencies]
arm-generic-timer = { version = "0.3.1", default-features = false, features = [
    "el2",
] }
rf-a-core = { workspace = true, default-features = false }

[dev-dependencies]
arm-generic-timer = { version = "0.3.1", default-features = false, features = [
    "el2",
    "fakes",
] }

[features]
default = []
fakes = ["rf-a-core/fakes", "arm-generic-timer/fakes"]
pauth = ["rf-a-core/pauth"]
rme = ["rf-a-core/rme", "sel2"]
sel2 = ["rf-a-core/sel2"]
max_log_off = ["rf-a-core/max_log_off"]
max_log_error = ["rf-a-core/max_log_error"]
max_log_warn = ["rf-a-core/max_log_warn"]
max_log_info = ["rf-a-core/max_log_info"]
max_log_debug = ["rf-a-core/max_log_debug"]
max_log_trace = ["rf-a-core/max_log_trace"]

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
unreadable_literal = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
