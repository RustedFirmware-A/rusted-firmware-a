[package]
name = "fvp-rf-a-bl31"
version = "0.1.0"
edition = "2024"
authors = ["Andrew Walbran <qwandor@google.com>"]
rust-version = "1.90"
license = "BSD-3-Clause"
description = "RF-A BL31 for the Arm Fixed Virtual Platform"

[dependencies]
arm-fvp-base-pac = { version = "0.3.0", default-features = false, features = [
  "base-revc",
  "el3",
] }
rf-a-core = { workspace = true, default-features = false }

[build-dependencies]
rf-a-build = { workspace = true }

[features]
default = ["sel2"]
pauth = ["rf-a-core/pauth"]
rme = ["rf-a-core/rme", "sel2"]
sel2 = ["rf-a-core/sel2"]
max_log_off = ["rf-a-core/max_log_off"]
max_log_error = ["rf-a-core/max_log_error"]
max_log_warn = ["rf-a-core/max_log_warn"]
max_log_info = ["rf-a-core/max_log_info"]
max_log_debug = ["rf-a-core/max_log_debug"]
max_log_trace = ["rf-a-core/max_log_trace"]

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
unreadable_literal = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
